<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración · Prana para Vos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <!-- ===== LOGIN ===== -->
  <div id="login-screen" class="login-screen">
    <div class="login-card">
      <h1>Prana para Vos</h1>
      <p class="login-sub">Panel de administración · Alma de Mar</p>
      <form id="login-form">
        <div class="field">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" required autocomplete="email">
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primario btn-block">
          <i class="fas fa-sign-in-alt"></i> Ingresar
        </button>
        <p id="login-error" class="login-error"></p>
      </form>
    </div>
  </div>

  <!-- ===== DASHBOARD ===== -->
  <div id="dashboard" class="dashboard hidden">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <h2>Prana para Vos</h2>
        <small>· Alma de Mar</small>
      </div>
      <nav class="sidebar-nav">
        <button class="nav-item active" data-section="hero"><i class="fas fa-star"></i> Hero</button>
        <button class="nav-item" data-section="sobre_mi"><i class="fas fa-user"></i> Sobre mí</button>
        <button class="nav-item" data-section="servicios"><i class="fas fa-spa"></i> Servicios</button>
        <button class="nav-item" data-section="alma_items"><i class="fas fa-hands-helping"></i> Alma de Mar</button>
        <button class="nav-item" data-section="proyectos"><i class="fas fa-project-diagram"></i> Proyectos</button>
        <button class="nav-item" data-section="videos"><i class="fab fa-youtube"></i> Videos</button>
        <button class="nav-item" data-section="libros"><i class="fas fa-book"></i> Libros</button>
        <button class="nav-item" data-section="galeria"><i class="fas fa-images"></i> Galería</button>
        <button class="nav-item" data-section="testimonios"><i class="fas fa-quote-right"></i> Testimonios</button>
        <button class="nav-item" data-section="recursos"><i class="fas fa-download"></i> Recursos</button>
        <button class="nav-item" data-section="contacto"><i class="fas fa-envelope"></i> Contacto</button>
      </nav>
      <div class="sidebar-footer">
        <a href="index.html" target="_blank" class="btn-side"><i class="fas fa-external-link-alt"></i> Ver sitio</a>
        <button id="logout-btn" class="btn-side btn-logout"><i class="fas fa-sign-out-alt"></i> Salir</button>
      </div>
    </aside>

    <main class="admin-main">
      <header class="admin-header">
        <div>
          <h1 id="section-title">Hero</h1>
          <p id="section-desc">Edita la sección principal del sitio</p>
        </div>
        <div class="user-info">
          <span id="user-email"></span>
          <div class="user-avatar"><i class="fas fa-user"></i></div>
        </div>
      </header>
      <div id="content-area" class="content-area"></div>
    </main>
  </div>
  <div id="toast" class="toast"></div>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
